name: Release
on:
  push:
    branches:
      - main
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install Dependencies
        run: yarn --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Release to Github and NPM
        id: release
        run: |
          set -o pipefail
          npx --yes semantic-release@25 | tee /tmp/sr.log
          if grep -q "Published release" /tmp/sr.log; then
            VERSION=$(grep -oP "Published release \K[0-9]+\.[0-9]+\.[0-9]+" /tmp/sr.log | tail -1)
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Released $VERSION"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            echo "No release published"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        timeout-minutes: 10
      - name: Trigger MyFinance rebuild
        if: steps.release.outputs.new_release_published == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.MYFINANCE_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/yanivfranco/MyFinance/dispatches \
            -d '{"event_type":"importer-updated","client_payload":{"version":"${{ steps.release.outputs.new_release_version }}"}}'
permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # required for npm trusted publishing (OIDC) + provenance
